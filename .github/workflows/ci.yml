name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - name: Import smoke test
        env:
          GITHUB_TOKEN: dummy
        run: |
          python -c "import agents.classifier_agent, agents.devrel_agent, tools.tavily_search, report_generator, run_pipeline"
